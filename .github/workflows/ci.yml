name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
  release:

# Cancel superseded in-progress runs for the same PR. Pushes to master/release
# use the unique run_id as the group, so those are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    # Fail fast on a hung job instead of running to GitHub's 6h default. Clean
    # jobs finish in <=11m; 25m leaves headroom for cache-cold precompilation.
    timeout-minutes: 25
    # Prerelease Julia is informational; don't let it block merges.
    continue-on-error: ${{ matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: 1
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # Reseau 1.6.1 must be registered before this PR is merged/released.
      # Until then, test this PR against the exact reviewed dependency commit.
      # Normal branch/tag CI continues to resolve packages from the registry.
      - name: Check out Reseau security fix for this PR
        if: github.event_name == 'pull_request' && github.head_ref == 'security/reseau-emudhra-release'
        uses: actions/checkout@v6
        with:
          repository: JuliaServices/Reseau.jl
          ref: 672fb51c52f26db740171ec173ad9534f0b02fcb
          path: .ci-reseau
          persist-credentials: false
      - name: Use unreleased Reseau for PR validation
        if: github.event_name == 'pull_request' && github.head_ref == 'security/reseau-emudhra-release'
        run: julia --project=. -e 'using Pkg; Pkg.develop(PackageSpec(path=".ci-reseau"))'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - name: Check buffered upload allocations
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        run: julia --threads=4 --project=. bench/buffered_upload_allocations.jl --check
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Check out Reseau security fix for this PR
        if: github.event_name == 'pull_request' && github.head_ref == 'security/reseau-emudhra-release'
        uses: actions/checkout@v6
        with:
          repository: JuliaServices/Reseau.jl
          ref: 672fb51c52f26db740171ec173ad9534f0b02fcb
          path: .ci-reseau
          persist-credentials: false
      - name: Use unreleased Reseau for PR validation
        if: github.event_name == 'pull_request' && github.head_ref == 'security/reseau-emudhra-release'
        run: |
          julia --project=. -e '
            using Pkg
            root = pwd()
            Pkg.develop(PackageSpec(path=joinpath(root, ".ci-reseau")))
            Pkg.activate("docs")
            Pkg.develop([PackageSpec(path=root), PackageSpec(path=joinpath(root, ".ci-reseau"))])'
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-docdeploy@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
