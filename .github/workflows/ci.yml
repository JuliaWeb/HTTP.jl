name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
  release:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    # Keep hangs bounded while allowing the full test suite and all 15 native
    # trim builds: cold runners can reach the final TLS build after 25 minutes.
    timeout-minutes: 35
    # Prerelease Julia is informational; don't let it block merges.
    continue-on-error: ${{ matrix.version == 'pre' }}
    # Per job, not per workflow, so a newer push cancels superseded tests but never a docs deploy.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-${{ strategy.job-index }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: 1
          # 32-bit Julia, where `Int` is `Int32`.
          - os: ubuntu-latest
            arch: x86
            version: 1
          - os: windows-latest
            arch: x86
            version: 1
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Set up 32-bit Linux
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86'
        run: |
          # The trim tests compile with `gcc -m32`.
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          # Julia stops at startup when it tries to load the runner's newer
          # 32-bit libstdc++ ("Unable to dlopen(cxxpath) in parent!"), so it
          # uses its own.
          echo "JULIA_PROBE_LIBSTDCXX=0" >> "$GITHUB_ENV"
          # One trim build and run: all 15 put a 32-bit job at the timeout.
          echo "HTTP_TRIM_ONLY=http_trim_client_h1_upload.jl" >> "$GITHUB_ENV"
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - name: Check buffered upload allocations
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        run: julia --threads=4 --project=. bench/buffered_upload_allocations.jl --check
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-docdeploy@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
